# Blocks any pod that requests a privileged container. Running privileged
# containers grants host-level capabilities and effectively bypasses all
# namespace security boundaries.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privileged
  annotations:
    policies.kyverno.io/title: Disallow Privileged Containers
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Privileged containers share namespaces with the host and bypass Pod
      Security constraints. This policy blocks any pod requesting privileged mode.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: disallow-privileged-containers
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Privileged containers are not allowed."
        pattern:
          spec:
            containers:
              - =(securityContext):
                  =(privileged): "false"
    - name: disallow-privileged-init-containers
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Privileged init containers are not allowed."
        pattern:
          spec:
            =(initContainers):
              - =(securityContext):
                  =(privileged): "false"
