# Allow pods in the platform namespace to reach the cluster DNS (kube-dns).
# Without this, DNS resolution fails under a default-deny policy, breaking
# virtually all inter-service communication.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: platform
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
