# Explicit default-deny for the platform namespace. Applied directly via ArgoCD
# to ensure it exists before Kyverno's generate rule fires, and to serve as
# the canonical reference for the generated rule's shape.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: platform
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
